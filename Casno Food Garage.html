<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Casno Food Garage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: slim prototype bar on top; customer site = full-width crimson header over a 1180px content column;
   staff panel = dark crimson sidebar + fluid workspace. Food art is flat SVG on category-tinted tiles. */
:root{
  --bg:#faf3f1; --surface:#ffffff; --surface-2:#f5eae8; --ink:#2b1114; --muted:#76595d; --line:#ebdad8;
  --brand:#9b1c2c; --brand-strong:#7a1221; --brand-tint:#fbe6e7; --brand-text:#9b1c2c; --brand-line:#d9a3a9; --on-brand:#ffffff;
  --nav-a:#a61e30; --nav-b:#7a1221; --bar:#2b1114; --bar-ink:#f6e9ea; --focus:#1f5fa8;
  --ok:#1b7447; --ok-tint:#dcf2e4; --warn:#8f5200; --warn-tint:#fcebc9; --info:#1d5aa0; --info-tint:#deeafa; --bad:#b3261e; --bad-tint:#fde4e1; --done:#5f6b66; --done-tint:#e8ecea;
  --shadow:0 1px 2px rgba(60,10,16,.06),0 8px 24px rgba(60,10,16,.07);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170c0e; --surface:#231417; --surface-2:#2e1b1f; --ink:#f7eaeb; --muted:#c1a5a8; --line:#40272b;
  --brand:#cf3a4b; --brand-strong:#e04a5b; --brand-tint:#3d1a20; --brand-text:#ff9aa5; --brand-line:#7d3640;
  --nav-a:#6c1120; --nav-b:#470a14; --bar:#0f0708; --bar-ink:#f6e9ea; --focus:#8ab4ff;
  --ok:#6fd49b; --ok-tint:#14301f; --warn:#f2c36b; --warn-tint:#3a2a0c; --info:#8fb8f2; --info-tint:#12263f; --bad:#ff8f86; --bad-tint:#3d1714; --done:#aab5b0; --done-tint:#232b28;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170c0e; --surface:#231417; --surface-2:#2e1b1f; --ink:#f7eaeb; --muted:#c1a5a8; --line:#40272b;
  --brand:#cf3a4b; --brand-strong:#e04a5b; --brand-tint:#3d1a20; --brand-text:#ff9aa5; --brand-line:#7d3640;
  --nav-a:#6c1120; --nav-b:#470a14; --bar:#0f0708; --bar-ink:#f6e9ea; --focus:#8ab4ff;
  --ok:#6fd49b; --ok-tint:#14301f; --warn:#f2c36b; --warn-tint:#3a2a0c; --info:#8fb8f2; --info-tint:#12263f; --bad:#ff8f86; --bad-tint:#3d1714; --done:#aab5b0; --done-tint:#232b28;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bar)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.15;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand-text)}
ul,ol{margin:0;padding:0;list-style:none}
svg{display:block}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.site :focus-visible,.side :focus-visible,.proto :focus-visible{outline-color:#fff}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bar);color:var(--bar-ink)}
.proto .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-block:8px}
.proto-id{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.proto-id b{font-family:var(--font-display);font-size:14px;letter-spacing:.02em}
.proto-id span{font-size:12px;opacity:.72}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:inherit;padding:7px 15px;border-radius:999px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:#fff;color:#2b1114}
.proto-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pt{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.28);color:inherit;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.pt:hover{background:rgba(255,255,255,.1)}
.pt .dot{width:26px;height:15px;border-radius:99px;background:rgba(255,255,255,.28);position:relative;transition:background .15s}
.pt .dot::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.pt[aria-checked="true"] .dot{background:#4cc38a}
.pt[aria-checked="true"] .dot::after{transform:translateX(11px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid transparent;font-weight:650;font-size:15px;line-height:1.1;background:var(--surface-2);color:var(--ink);text-decoration:none;transition:background .15s,border-color .15s,transform .06s;text-align:center}
.btn .ico{width:18px;height:18px}
.btn:hover{background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-strong)}
.btn-outline{background:transparent;border-color:var(--brand-line);color:var(--brand-text)}
.btn-outline:hover{background:var(--brand-tint)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger:hover{filter:brightness(.92);background:var(--bad)}
.btn-ghost{background:transparent;color:var(--brand-text)}
.btn-ghost:hover{background:var(--brand-tint)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.iconbtn:hover{color:var(--bad);border-color:var(--bad)}
.iconbtn.neutral:hover{color:var(--brand-text);border-color:var(--brand-line)}
.iconbtn[disabled]{opacity:.4;pointer-events:none}
.iconbtn .ico{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--brand-text);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* customer header */
.site{background:linear-gradient(100deg,var(--nav-a),var(--nav-b));color:#fff}
.site-in{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:#fff;text-align:left}
.logo{width:42px;height:42px}
.brand-t{display:flex;flex-direction:column;line-height:1}
.brand-t b{font-family:var(--font-display);font-size:25px;letter-spacing:.06em;font-weight:800}
.brand-t small{font-size:10.5px;letter-spacing:.2em;font-weight:600;opacity:.9;margin-top:3px}
.site-sub{display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.35);padding-left:20px;line-height:1.25}
.site-sub b{font-family:var(--font-display);font-size:17px}
.site-sub span{font-size:12.5px;opacity:.85}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav>li{position:relative}
.nav-link{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 12px;border:0;background:none;color:#fff;font-weight:600;font-size:14.5px;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;opacity:.92}
.nav-link:hover{background:rgba(255,255,255,.12);opacity:1}
.nav-link[aria-current="page"]{border-bottom-color:#fff;opacity:1}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#fff;color:var(--brand);font-size:12px;font-weight:800;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.count.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35)}}
.dd{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40}
.dd button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;text-align:left;font-weight:600}
.dd button:hover{background:var(--surface-2)}
.dd .who{padding:8px 12px 6px;font-size:12.5px;color:var(--muted)}

/* flow steps */
.flow{background:var(--surface);border-bottom:1px solid var(--line)}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:10px}
.steps li{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13.5px;font-weight:600;color:var(--muted);flex:1 1 0;min-width:max-content}
.steps li+li::before{content:"";flex:1;height:2px;background:var(--line);min-width:14px;margin-right:2px}
.steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted);flex:none}
.steps .n .ico{width:14px;height:14px;stroke-width:2.6}
.steps li.done{color:var(--ink)}
.steps li.done .n{background:var(--ok);color:#fff}
.steps li.now{color:var(--brand-text)}
.steps li.now .n{background:var(--brand);color:#fff}
.steps button{background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;display:flex;align-items:center;gap:8px;text-decoration:underline;text-underline-offset:3px}
.steps li.now span.lbl{text-decoration:none}

/* generic blocks */
.view{padding-block:26px 56px;outline:0}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:18px}
.page-h h1{font-size:clamp(26px,3.4vw,36px)}
.page-h p{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:20px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:14px;align-items:center}
.crumbs button{background:none;border:0;padding:0;color:var(--brand-text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:650;background:var(--ok-tint);color:var(--ok)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.off{background:var(--bad-tint);color:var(--bad)}
.hci{display:none;margin:0 0 18px;padding:12px 14px;border:1.5px dashed var(--info);background:var(--info-tint);border-radius:12px;color:var(--ink)}
.notes-on .hci{display:block}
.hci h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--info);margin-bottom:8px;font-family:var(--font-body);font-weight:800}
.hci ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px}
.hci li{font-size:13.5px}
.hci b{color:var(--info)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-received{background:var(--warn-tint);color:var(--warn)}
.st-preparing{background:var(--info-tint);color:var(--info)}
.st-ready{background:var(--ok-tint);color:var(--ok)}
.st-completed{background:var(--done-tint);color:var(--done)}
.st-cancelled{background:var(--bad-tint);color:var(--bad)}
.badge.avail{background:var(--ok-tint);color:var(--ok)}
.badge.sold{background:var(--bad-tint);color:var(--bad)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.legend{font-weight:650;font-size:14px}
.field .opt{font-weight:500;color:var(--muted)}
.input{width:100%;min-height:46px;padding:10px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
textarea.input{min-height:84px;resize:vertical}
select.input{appearance:auto}
.input:hover{border-color:var(--brand-line)}
.input:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.input[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-tint)}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13.5px;color:var(--bad);font-weight:600;display:none;align-items:center;gap:6px}
.has-error .err{display:flex}
.form-alert{display:none;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bad-tint);color:var(--bad);font-weight:600;margin-bottom:16px}
.form-alert.show{display:flex}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-tint);color:var(--warn);font-weight:600;margin-bottom:16px}
.notice.info{background:var(--info-tint);color:var(--info)}
.notice .ico{margin-top:2px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.choice:hover{border-color:var(--brand-line)}
.choice:has(input:checked){border-color:var(--brand);background:var(--brand-tint)}
.choice:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.choice input{margin-top:4px;accent-color:var(--brand);width:18px;height:18px;flex:none}
.choice b{display:block;font-weight:650}
.choice span.s{font-size:13.5px;color:var(--muted)}
.choice .pr{margin-left:auto;font-weight:700;white-space:nowrap}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
.legend{display:block;margin-bottom:8px;padding:0}
.switch{width:46px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:none;display:grid;place-items:center;color:var(--brand-text)}
.stepper button:hover{background:var(--brand-tint)}
.stepper button[disabled]{opacity:.35;pointer-events:none}
.stepper output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;padding-block:34px 12px}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--brand-text);margin-bottom:12px}
.hero h1{font-size:clamp(40px,6vw,68px);font-weight:800;line-height:1.02}
.hero h1 em{font-style:normal;color:var(--brand-text)}
.hero p.lead{font-size:18px;color:var(--muted);margin:18px 0 24px;max-width:46ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.hero-cta .btn{min-height:50px;padding:0 24px;font-size:16px}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--muted);font-size:14px}
.hero-facts b{color:var(--ink)}
.hero-art{border-radius:26px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:520/380;background:var(--brand)}
.hero-art>svg{width:100%;height:100%}
.eta{display:flex;gap:8px;align-items:center}.eta .ico{width:16px;height:16px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
.feat{display:flex;gap:14px;align-items:flex-start;padding:18px}
.feat .ic{width:46px;height:46px;border-radius:12px;background:var(--brand-tint);color:var(--brand-text);display:grid;place-items:center;flex:none}
.feat .ic .ico{width:24px;height:24px}
.feat h3{font-size:18px;margin-bottom:3px}
.feat p{color:var(--muted);font-size:14.5px}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:h}
.how li{padding:16px 16px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;counter-increment:h}
.how li::before{content:counter(h);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:14px;margin-bottom:10px}
.how b{display:block;margin-bottom:2px}
.how span{color:var(--muted);font-size:14px}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-block:22px;color:var(--muted);font-size:13.5px}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}

/* menu */
.menu-l{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.cats{padding:10px;position:sticky;top:76px}
.cats h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;font-family:var(--font-body);font-weight:800}
.cats button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:11px 12px;border-radius:10px;font-weight:600;text-align:left}
.cats button:hover{background:var(--surface-2)}
.cats button[aria-pressed="true"]{background:var(--brand);color:#fff}
.cats .n{font-size:12.5px;opacity:.75;font-variant-numeric:tabular-nums}
.searchbox{position:relative;flex:1;min-width:200px;max-width:460px}
.searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.searchbox .input{padding-left:40px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.dish{display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s}
.dish:hover{transform:translateY(-2px)}
.dish .main{display:block;width:100%;text-align:left;background:none;border:0;padding:0}
.dish .art{aspect-ratio:4/3;position:relative;overflow:hidden}
.dish .art svg{width:100%;height:100%}
.dish .body{padding:14px 16px 4px}
.dish h3{font-size:18px}
.dish p.d{font-size:13.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.dish .foot-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 16px;margin-top:auto}
.price{font-family:var(--font-display);font-size:21px;font-weight:800;color:var(--brand-text);font-variant-numeric:tabular-nums}
.dish.off .art svg{filter:grayscale(.85);opacity:.7}
.tag{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;letter-spacing:.03em}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.empty .btn{margin-top:16px}

let toastSeq = 0; const toastActs = {};
function toast(msg, o = {}) {
  const id = ++toastSeq, el = document.createElement('div');
  el.className = 'toast' + (o.warn ? ' warn' : '');
  el.innerHTML = `${ico(o.warn ? 'info' : 'check')}<span>${esc(msg)}</span>${o.action ? `<button type="button" data-act="toast-act" data-tid="${id}">${esc(o.action.label)}</button>` : ''}`;
  if (o.action) toastActs[id] = o.action.fn;
  const box = $('#toasts'); while (box.children.length > 2) box.firstChild.remove();
  box.appendChild(el);
  setTimeout(() => { el.remove(); delete toastActs[id]; }, o.action ? 6500 : 3800);
}
let lastFocus = null;
function openModal(html, focusSel) {
  lastFocus = document.activeElement;
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('modal-open');
  const t = (focusSel && $(focusSel, root)) || $('input,select,textarea,button.btn', root);
  t && t.focus();
}
function closeModal() {
  $('#modal-root').innerHTML = ''; document.body.classList.remove('modal-open');
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
function field(o) {
  const id = o.id, tag = o.tag || 'input';
  const attrs = `id="${id}" name="${id}" class="input" ${o.type ? `type="${o.type}"` : ''} ${o.ph ? `placeholder="${esc(o.ph)}"` : ''} ${o.auto ? `autocomplete="${o.auto}"` : ''} ${o.mode ? `inputmode="${o.mode}"` : ''} ${o.attrs || ''} aria-describedby="${id}-h ${id}-e"`;
  const ctl = tag === 'textarea' ? `<textarea ${attrs}>${esc(o.value || '')}</textarea>` : `<input ${attrs} value="${esc(o.value || '')}">`;
  return `<div class="field" data-f="${id}"><label for="${id}">${esc(o.label)}${o.optional ? ' <span class="opt">(optional)</span>' : ''}</label>${ctl}${o.hint ? `<span class="hint" id="${id}-h">${esc(o.hint)}</span>` : `<span id="${id}-h"></span>`}<span class="err" id="${id}-e" role="alert">${ico('alert')}<span></span></span></div>`;
}
function setErr(id, msg) {
  const f = $(`[data-f="${id}"]`); if (!f) return;
  const inp = $('.input', f);
  if (msg) { f.classList.add('has-error'); $('.err span', f).textContent = msg; inp.setAttribute('aria-invalid', 'true'); }
  else { f.classList.remove('has-error'); inp.removeAttribute('aria-invalid'); }
}
const HCI = {

  menu:[['Clear navigation','The progress strip and highlighted nav link show where the user is in the order.'],['Feedback','Add to Cart gives a toast, a button change and an animated cart count.'],['Error prevention','Sold-out dishes are labeled and cannot be added.'],['Visibility','Categories, search and prices stay on screen while browsing.']],
  item:[['User control','Quantity, add-ons and notes can be changed before adding; Back to Menu is always at the top.'],['Feedback','The Add button shows the live total, and a success panel confirms the add.'],['Visual hierarchy','Name, then price, then options, then the main action.']],
  cart:[['User control','Change quantity, remove with Undo, or clear the cart.'],['Visibility','The total and the Proceed to Checkout button stay in view.'],['Error prevention','Quantity is limited to 1–20 and the checkout button is disabled when the cart is empty.']],
  checkout:[['Error prevention','Inline checks for name, PH mobile number and delivery address, with hints before typing.'],['Feedback','An error summary appears and the button shows “Placing order…”.'],['User control','Back to cart is available at any point; nothing is charged here.'],['Visibility','The order summary stays beside the form.']],

  orders:[['Visibility','Active orders show a status badge and a Track button.'],['Clear navigation','Orders has its own nav item with a count of active orders.']],
  s_dashboard:[['Visibility','Key counts first, then orders that need action.'],['Efficiency','Start preparing straight from the dashboard.']],
  s_orders:[['Visibility','Status counts, filters and badges with text labels (not color alone).'],['Feedback','Updating a status shows a toast, and the customer’s tracker changes too.'],['User control','Cancel needs a confirmation step.']],
  s_customers:[['Error prevention','Add Customer validates name, phone and email before saving.'],['Consistency','Tables, search and pagination work the same as Orders and Menu.']],
  s_menu:[['Error prevention','Delete asks for confirmation; sold-out switch is separate from deleting.'],['Feedback','Availability changes show immediately on the customer menu.']],
  s_settings:[['Feedback','Every switch applies instantly and says so.'],['Error prevention','Turning off orders disables checkout for customers.']]

function hciBar(k) {
  const n = HCI[k]; if (!n) return '';
  return `<aside class="hci" aria-label="HCI notes for this screen"><h2>HCI principles on this screen</h2><ul>${n.map(([a, b]) => `<li><b>${a}.</b> ${b}</li>`).join('')}</ul></aside>`;
}

/* ---------- cart logic ---------- */
const cfgOf = m => EXTRAS[m.cat] || {extras:[]};
function lineUnit(l) {
  const m = menuById(l.id), c = cfgOf(m); let p = m.price;
  if (c.sizes && l.size) p += (c.sizes.find(s => s.id === l.size) || {add:0}).add;
  l.extras.forEach(e => p += (c.extras.find(x => x.id === e) || {price:0}).price);
  return p;
}
function lineDesc(l) {
  const m = menuById(l.id), c = cfgOf(m), out = [];
  if (c.sizes && l.size) out.push((c.sizes.find(s => s.id === l.size) || {label:''}).label.split(' (')[0]);
  l.extras.forEach(e => { const x = c.extras.find(z => z.id === e); if (x) out.push(x.label.replace(/ \(.*\)/, '')); });
  return out.join(' · ');
}
const cartLines = () => { S.cart = S.cart.filter(l => menuById(l.id)); return S.cart; };
const cartCount = () => cartLines().reduce((a, l) => a + l.qty, 0);
const cartSub = () => cartLines().reduce((a, l) => a + lineUnit(l) * l.qty, 0);
function addLine(id, qty, size, extras, note) {
  const key = [id, size, [...extras].sort().join(','), note.trim()].join('|');
  const ex = S.cart.find(l => l.key === key);
  if (ex) ex.qty = Math.min(20, ex.qty + qty); else S.cart.push({key, id, qty, size, extras:[...extras], note:note.trim()});
  updateCartUi(true);
}
function updateCartUi(bump) {
  const n = cartCount();
  $$('.cart-count').forEach(el => { el.textContent = n; el.hidden = !n; if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } });
  const bar = $('#cartBar'); if (bar) bar.innerHTML = cartBarInner();
}
const cartBarInner = () => cartCount() ? `<div><span><b>${plural(cartCount(), 'item')}</b> in your cart · <b>${peso(cartSub())}</b></span><button type="button" class="btn btn-primary btn-sm" data-act="go" data-view="cart">View cart ${ico('arrow')}</button></div>` : '';

/* ---------- customer shell ---------- */

function flowSteps() {
  const v = S.view; if (!['menu', 'item', 'cart', 'checkout', 'confirm', 'status'].includes(v)) return '';
  const idx = {menu:0, item:0, cart:1, checkout:2, confirm:3, status:3}[v], done = idx === 3;
  const defs = [['Choose food', 'menu'], ['Review cart', 'cart'], ['Checkout', 'checkout'], ['Track order', 'status']];
  return `<div class="flow"><div class="wrap"><ol class="steps" aria-label="Order progress">${defs.map(([l, t], i) => {
    const st = i < idx || (done && i < 3) ? 'done' : i === idx ? 'now' : '';
    const clickable = st === 'done' && !(idx === 3);
    const inner = `<span class="n">${st === 'done' ? ico('check') : i + 1}</span><span class="lbl">${l}</span>`;
    return `<li class="${st}" ${st === 'now' ? 'aria-current="step"' : ''}>${clickable ? `<button type="button" data-act="go" data-view="${t}">${inner}</button>` : inner}</li>`;
  }).join('')}</ol></div></div>`;
}
const shopPill = () => S.settings.open ? `<span class="pill">Open now · ready in ${S.settings.eta} min</span>` : `<span class="pill off">Closed · not taking orders</span>`;

}

/* ---------- Menu ---------- */
function menuFiltered() {
  const q = S.q.trim().toLowerCase();
  return S.menu.filter(m => (S.cat === 'All' || m.cat === S.cat) && (!q || m.name.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q)));
}
function menuGridHtml() {
  const items = menuFiltered();

  const c = cfgOf(m);
  S.det = {id, qty:1, size:c.sizes ? c.sizes[0].id : '', extras:[], note:''}; S.detAdded = null;
  go('item');
}

function refreshDet() {
  const d = S.det; if (!d) return;
  const t = $('#detTotal'); if (t) t.textContent = peso(detUnit() * d.qty);
  const q = $('#detQty'); if (q) q.textContent = d.qty;

/* ---------- Checkout ---------- */
const coFee = () => S.co.type === 'Delivery' ? 30 : 0;

function validateCo() {
  const c = S.co, e = {};
  if (c.name.trim().length < 2) e.coName = 'Enter your full name so we can call your order.';
  if (!c.phone.trim()) e.coPhone = 'Enter your mobile number.';
  else if (!validPhone(c.phone)) e.coPhone = 'Use an 11-digit mobile number starting with 09, like 0917 123 4567.';
  if (c.type === 'Delivery' && c.address.trim().length < 8) e.coAddress = 'Enter a delivery address with street and barangay.';
  return e;
}
function submitCheckout() {
  if (S.placing) return;
  const e = validateCo();
  ['coName', 'coPhone', 'coAddress'].forEach(k => setErr(k, e[k] || ''));
  const al = $('#coAlert'), keys = Object.keys(e);
  if (keys.length) {
    al.classList.add('show'); $('span', al).textContent = `Please fix ${plural(keys.length, 'field')} before placing your order.`;
    al.focus(); const first = $('#' + keys[0]); first && first.focus(); return;
  }
  al.classList.remove('show');
  const b = $('#placeBtn'); S.placing = true; b.disabled = true; b.textContent = 'Placing order…';
  setTimeout(() => { S.placing = false; placeOrder(); }, 700);
}
function placeOrder() {
  const c = S.co, type = c.type, now = new Date();
  const items = cartLines().map(l => ({name:menuById(l.id).name, qty:l.qty, price:lineUnit(l), opts:lineDesc(l)}));
  const notes = cartLines().filter(l => l.note).map(l => `${menuById(l.id).name}: ${l.note}`).join(' · ');
  const o = {id:S.nextId++, name:c.name.trim(), phone:fmtPhone(c.phone), email:S.user ? S.user.email : '', type, address:type === 'Delivery' ? c.address.trim() : '',
    pay:c.pay === 'cash' ? (type === 'Pickup' ? 'Cash on pickup' : 'Cash on delivery') : 'Online payment (GCash / Card)', items, status:'Received', placed:now, times:{Received:now}, fee:type === 'Delivery' ? 30 : 0, note:notes || 'No special instructions.'};
  S.orders.unshift(o); S.myOrders.unshift(o.id); S.lastOrderId = o.id; S.statusId = o.id; S.selOrder = o.id; S.ordPage = 1; S.ordFilter = 'All'; S.ordQ = '';
  const ex = S.customers.find(x => normPhone(x.phone) === normPhone(o.phone));
  if (ex) ex.orders++; else S.customers.push({id:'CUST' + String(S.nextCus++).padStart(3, '0'), name:o.name, phone:o.phone, email:o.email || '—', orders:1});
  S.cart = []; go('confirm');
}
const orderTotal = o => o.items.reduce((a, i) => a + i.price * i.qty, 0) + (o.fee || 0);

}
function stepsFor(o) {
  const del = o.type === 'Delivery';
  return [['Order Received', 'We have your order and the kitchen will start soon.'], ['Preparing Your Food', 'Our cooks are making your order fresh.'], [del ? 'Out for Delivery' : 'Ready for Pickup', del ? 'Your rider is on the way to you.' : `Show order #${o.id} at the counter.`], ['Completed', 'Enjoy your meal!']];
}
function vStatus() {
  const o = orderById(S.statusId); if (!o) return vOrders();

  const track = cancelled ? `<div class="notice" style="background:var(--bad-tint);color:var(--bad)">${ico('alert')}<span>This order was cancelled at ${fmtTime(o.times.Cancelled)}. You haven’t been charged.</span></div>`

    <div class="page-h"><div><h1>Order Status</h1><p>Order <b>#${o.id}</b> · placed ${fmtTime(o.placed)}</p></div><span class="badge st-${o.status.toLowerCase()}">${o.status}</span></div>

    <aside class="card pad sum" aria-label="Order details"><h2 class="sec-t">Your order</h2><ul class="mini">${o.items.map(i => `<li><span>${i.qty} × ${esc(i.name)}${i.opts ? `<br><small class="muted">${esc(i.opts)}</small>` : ''}</span><span class="tnum">${peso(i.price * i.qty)}</span></li>`).join('')}</ul>
      <div class="rows"><div><span>${o.type}</span><span>${o.fee ? peso(o.fee) : 'Free'}</span></div><div class="total"><span>Total</span><span>${peso(orderTotal(o))}</span></div></div>

}

function submitAuth(form) {
  const login = form.dataset.tab === 'login', v = id => ($('#' + id, form) || {value:''}).value.trim(), e = {};
  if (!login) { if (v('auName').length < 2) e.auName = 'Enter your full name.'; if (!validPhone(v('auPhone'))) e.auPhone = 'Use an 11-digit mobile number starting with 09.'; }
  if (!validEmail(v('auEmail'))) e.auEmail = 'Enter a valid email, like name@email.com.';
  if (v('auPass').length < 6) e.auPass = 'Password must be at least 6 characters.';
  ['auName', 'auPhone', 'auEmail', 'auPass'].forEach(k => setErr(k, e[k] || ''));
  const keys = Object.keys(e); if (keys.length) { $('#' + keys[0], form).focus(); return; }
  const demo = v('auEmail').toLowerCase() === 'juan.delacruz@email.com';
  const name = login ? (demo ? 'Juan Dela Cruz' : v('auEmail').split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase())) : v('auName');
  S.user = {name, email:v('auEmail'), phone:login ? (demo ? '+63 912 345 6789' : '') : fmtPhone(v('auPhone'))};
  closeModal(); toast(login ? `Welcome back, ${name.split(' ')[0]}!` : `Account created. Welcome, ${name.split(' ')[0]}!`); renderApp();
}

const nextLabel = o => { const n = STAT[STAT.indexOf(o.status) + 1]; return n === 'Ready' ? (o.type === 'Delivery' ? 'Out for delivery' : 'Ready for pickup') : n; };

function pagerHtml(k, page, total, per) {
  const pages = Math.max(1, Math.ceil(total / per)), from = total ? (page - 1) * per + 1 : 0, to = Math.min(page * per, total);
  let nums = ''; for (let i = 1; i <= pages; i++) nums += `<button type="button" data-act="page" data-k="${k}" data-p="${i}" ${i === page ? 'aria-current="page"' : ''} aria-label="Page ${i}">${i}</button>`;
  return `<div class="pager"><span>Showing ${from}–${to} of ${total}</span><div class="pg"><button type="button" data-act="page" data-k="${k}" data-p="${page - 1}" aria-label="Previous page" ${page <= 1 ? 'disabled' : ''}>${ico('left')}</button>${nums}<button type="button" data-act="page" data-k="${k}" data-p="${page + 1}" aria-label="Next page" ${page >= pages ? 'disabled' : ''}>${ico('right')}</button></div></div>`;
}

function stat(ic, label, val) { return `<div class="card stat"><span class="ic">${ico(ic)}</span><div><small>${label}</small><b>${val}</b></div></div>`; }

function sDashboard() {
  const live = S.orders.filter(o => o.status !== 'Cancelled'), rev = live.reduce((a, o) => a + orderTotal(o), 0), rec = S.orders.filter(o => o.status === 'Received');
  const counts = {}; live.forEach(o => o.items.forEach(i => counts[i.name] = (counts[i.name] || 0) + i.qty));
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5), mx = top.length ? top[0][1] : 1, off = S.menu.filter(m => !m.avail);
  return `<div class="stats">${stat('orders', 'Orders today', S.orders.length)}${stat('pesos', 'Sales today', peso(rev))}${stat('chart', 'Average order', live.length ? peso(Math.round(rev / live.length)) : '—')}${stat('clock', 'Waiting for you', rec.length)}</div>
  <div class="dash-g"><section class="card panel" aria-labelledby="na-t"><div class="panel-h"><h2 id="na-t">Needs attention</h2><button type="button" class="link" data-act="staff-nav" data-v="orders">All orders</button></div>

}

const A = {
  mode(el) { S.mode = el.dataset.mode; closeModal(); renderApp({top:true}); },
  notes() { S.notes = !S.notes; syncProto(); },
  reset() { const n = S.notes; seed(); S.notes = n; closeModal(); renderApp({top:true}); toast('Demo reset to its starting state'); },
  go(el) { go(el.dataset.view); },
  'toast-act'(el) { const f = toastActs[el.dataset.tid]; el.closest('.toast').remove(); f && f(); },
  dd(el) { const dd = el.parentElement.querySelector('.dd'), open = dd.hidden; closeDd(); if (open) { dd.hidden = false; el.setAttribute('aria-expanded', 'true'); } },
  auth() { authModal('login'); },
  'auth-tab'(el) { authModal(el.dataset.tab); },
  'demo-login'() {
    if ($('#authForm').dataset.tab !== 'login') authModal('login');
    $('#auEmail').value = 'juan.delacruz@email.com'; $('#auPass').value = 'demo1234'; submitAuth($('#authForm'));
  },
  logout() { S.user = null; renderApp(); toast('You have been logged out'); },
  'modal-x'() { closeModal(); },
  'modal-bg'(el, e) { if (e.target === el) closeModal(); },
  cat(el) { S.cat = el.dataset.cat; updateMenuView(); },
  'cat-go'(el) { S.cat = el.dataset.cat; S.q = ''; go('menu'); },
  'clear-search'() { S.q = ''; $('#menuQ').value = ''; updateMenuView(); $('#menuQ').focus(); },
  'open-item'(el) { openItem(el.dataset.id); },
  'quick-add'(el) {
    const m = menuById(el.dataset.id); if (!m || !m.avail || !S.settings.open) return;
    const c = cfgOf(m); addLine(m.id, 1, c.sizes ? c.sizes[0].id : '', [], '');
    const old = el.innerHTML; el.innerHTML = ico('check') + 'Added'; setTimeout(() => { if (document.body.contains(el)) el.innerHTML = old; }, 1400);
    toast(`${m.name} added to cart`, {action:{label:'View cart', fn:() => go('cart')}});
  },
  'det-qty'(el) { S.det.qty = Math.max(1, Math.min(20, S.det.qty + Number(el.dataset.d))); refreshDet(); },
  'det-add'() {
    const d = S.det; addLine(d.id, d.qty, d.size, d.extras, d.note); S.detAdded = {qty:d.qty}; renderApp();
    const b = $('#addedBox'); if (b) { b.scrollIntoView({block:'center'}); b.focus({preventScroll:true}); }
  },
  'cart-qty'(el) {
    const i = Number(el.dataset.i), d = Number(el.dataset.d), l = S.cart[i]; if (!l) return;
    l.qty = Math.max(1, Math.min(20, l.qty + d)); renderApp();
    refocus(`[data-act="cart-qty"][data-i="${i}"][data-d="${d}"]`) ; if (!document.activeElement || document.activeElement === document.body) refocus(`[data-act="cart-qty"][data-i="${i}"][data-d="${-d}"]`);
  },
  'cart-rm'(el) {
    const i = Number(el.dataset.i), snap = JSON.parse(JSON.stringify(S.cart)), nm = menuById(S.cart[i].id).name;
    S.cart.splice(i, 1); renderApp(); toast(`${nm} removed from cart`, {action:{label:'Undo', fn:() => { S.cart = snap; renderApp(); }}});
  },
  'clear-cart'() { const snap = JSON.parse(JSON.stringify(S.cart)); S.cart = []; renderApp(); toast('Cart cleared', {action:{label:'Undo', fn:() => { S.cart = snap; renderApp(); }}}); },
  status(el) { S.statusId = Number(el.dataset.id); go('status'); },
  'demo-adv'(el) { const o = orderById(Number(el.dataset.id)); if (o && advance(o)) { renderApp(); toast(`Order #${o.id} is now ${o.status}`); refocus('[data-act="demo-adv"]'); } },
  'cancel-ask'(el) {
    const o = orderById(Number(el.dataset.id)), staff = el.dataset.staff;
    confirmModal(`Cancel order #${o.id}?`, staff ? `${esc(o.name)} will see this order as cancelled. This can’t be undone.` : 'The kitchen will stop preparing it and you won’t be charged. This can’t be undone.', 'Yes, cancel order', 'cancel-do', o.id, 'Keep order');
  },
  'cancel-do'(el) { const o = orderById(Number(el.dataset.id)); o.status = 'Cancelled'; o.times.Cancelled = new Date(); closeModal(); renderApp(); toast(`Order #${o.id} cancelled`); },
  'staff-nav'(el) { S.staffView = el.dataset.v; renderApp({top:true}); },
  'staff-logout'() { S.mode = 'customer'; S.view = 'home'; renderApp({top:true}); toast('Logged out of the staff panel'); },
  'to-customer'() { S.mode = 'customer'; renderApp({top:true}); },
  'sel-order'(el) {
    const id = Number(el.dataset.id); S.selOrder = id; ordPartial(`[data-act="sel-order"][data-id="${id}"]`);
    if (window.innerWidth <= 1060) $('#odPanel').scrollIntoView({block:'start'});
  },
  'close-od'() { S.selOrder = null; ordPartial(); },
  'ord-filter'(el) { S.ordFilter = el.dataset.f; S.ordPage = 1; $$('[data-act="ord-filter"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.ordFilter))); ordPartial(); },
  page(el) {
    const k = el.dataset.k, p = Number(el.dataset.p);
    if (k === 'ord') { S.ordPage = p; $('#ordTable').innerHTML = ordTableHtml(); } else { S.cusPage = p; $('#cusTable').innerHTML = cusTableHtml(); }
    refocus(`[data-act="page"][data-k="${k}"][data-p="${p}"]`);
  },
  adv(el) {
    const o = orderById(Number(el.dataset.id)); if (!o || !advance(o)) return;
    renderApp(); toast(`Order #${o.id} marked ${o.status}. The customer’s tracker is updated.`); refocus(`[data-act="adv"][data-id="${o.id}"]`);
  },
  'view-from-dash'(el) {
    const id = Number(el.dataset.id); S.selOrder = id; S.staffView = 'orders'; S.ordFilter = 'All'; S.ordQ = '';
    S.ordPage = Math.floor(ordFiltered().findIndex(o => o.id === id) / 7) + 1; renderApp({top:true});
  },
  contact(el) {
    const o = orderById(Number(el.dataset.id)), f = o.name.split(' ')[0];
    const tail = {Received:'we received your order and will start preparing it shortly.', Preparing:'it is being prepared now.', Ready:o.type === 'Delivery' ? 'it is on its way to you.' : 'it is ready for pickup. Please show this order number at the counter.', Completed:'thank you for ordering with us!', Cancelled:'it has been cancelled.'}[o.status];
    openModal(`<button type="button" class="iconbtn neutral m-x" data-act="modal-x" aria-label="Close">${ico('x')}</button><h2>Contact ${esc(f)}</h2><p class="sub">Call or text from your own phone. This prototype doesn’t place calls.</p>
      <div class="field"><label for="cpPhone">Mobile number</label><input id="cpPhone" class="input" readonly value="${esc(o.phone)}"></div>
      <div class="field"><label for="cpMsg">Suggested message</label><textarea id="cpMsg" class="input" rows="4" readonly>Hi ${esc(f)}, this is Casno Food Garage. Your order #${o.id} — ${tail}</textarea></div>
      <div class="acts"><button type="button" class="btn btn-outline" data-act="copy" data-t="cpPhone">${ico('copy')}Copy number</button><button type="button" class="btn btn-outline" data-act="copy" data-t="cpMsg">${ico('copy')}Copy message</button><button type="button" class="btn btn-primary" data-act="modal-x">Done</button></div>`, '.btn-outline');
  },
  copy(el) {
    const t = $('#' + el.dataset.t), fb = () => { t.focus(); t.select(); toast('Selected. Press Ctrl+C (or ⌘C) to copy.', {warn:true}); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(() => toast('Copied to clipboard')).catch(fb); else fb();
  },
  'cus-view'(el) { cusModal(S.customers.find(c => c.id === el.dataset.id)); },
  'cus-add'() { cusAddModal(); },
  'm-cat'(el) { S.mCat = el.dataset.cat; renderApp(); refocus(`[data-act="m-cat"][data-cat="${S.mCat}"]`); },
  'm-add'() { menuModal(null); },
  'm-edit'(el) { menuModal(menuById(el.dataset.id)); },
  'm-del'(el) { const m = menuById(el.dataset.id); confirmModal(`Delete ${esc(m.name)}?`, 'Customers will no longer see it on the menu. You can undo this right after.', 'Delete item', 'm-del-do', m.id, 'Keep item'); },
  'm-del-do'(el) {
    const i = S.menu.findIndex(m => m.id === el.dataset.id), m = S.menu[i]; S.menu.splice(i, 1); closeModal(); renderApp();
    toast(`${m.name} deleted`, {action:{label:'Undo', fn:() => { S.menu.splice(i, 0, m); renderApp(); }}});
  },
  'toggle-avail'(el) {
    const m = menuById(el.dataset.id); m.avail = !m.avail; renderApp();
    toast(m.avail ? `${m.name} is available again` : `${m.name} now shows as sold out to customers`); refocus(`[data-act="toggle-avail"][data-id="${m.id}"]`);
  },
  set(el) {
    const k = el.dataset.k; S.settings[k] = !S.settings[k]; if (k === 'delivery' && !S.settings.delivery) S.co.type = 'Pickup'; renderApp();
    toast(k === 'open' ? (S.settings.open ? 'Online ordering is on' : 'Online ordering is off. Customers can’t check out.') : (S.settings.delivery ? 'Delivery is on' : 'Delivery is off')); refocus(`[data-act="set"][data-k="${k}"]`);
  },
  jump(el) {
    const m = el.dataset.m, v = el.dataset.v;
    if (m === 'staff') { S.mode = 'staff'; S.staffView = v; renderApp({top:true}); return; }
    if (v === 'item') { openItem('m1'); return; }
    if (v === 'cart' || v === 'checkout') demoCart();
    if (['confirm', 'status', 'orders'].includes(v)) { ensureOrder(); S.statusId = S.statusId || S.lastOrderId; }
    go(v);
  },
  'start-task'() { S.cart = []; S.co = {type:'Pickup', name:'', phone:'', address:'', pay:'cash'}; go('home'); toast('Task started: order a Classic Burger and an Iced Coffee for pickup'); }
};
const CHG = {
  'm-cat-sel'(t) { S.mCat = t.value; renderApp(); refocus('#mCatSel'); },
  eta(t) { S.settings.eta = t.value; toast(`Estimated time set to ${t.value} minutes`); }
};

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  if (!e.target.closest('.dd') && !e.target.closest('[data-act="dd"]')) closeDd();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('input', e => {
  const t = e.target, co = t.dataset.co;
  if (co === 'name' || co === 'phone' || co === 'address') S.co[co] = t.value;
  if (t.id === 'menuQ') { S.q = t.value; updateMenuView(); }
  else if (t.id === 'ordQ') { S.ordQ = t.value; S.ordPage = 1; $('#ordTable').innerHTML = ordTableHtml(); }
  else if (t.id === 'cusQ') { S.cusQ = t.value; S.cusPage = 1; $('#cusTable').innerHTML = cusTableHtml(); }
  else if (t.id === 'mQ') { S.mQ = t.value; $('#mTable').innerHTML = mTableHtml(); }
  else if (t.dataset.det === 'note') { S.det.note = t.value; $('#noteN').textContent = t.value.length; }
  const f = t.closest('.has-error'); if (f && co) { const v = validateCo(), id = f.dataset.f; if (!v[id]) setErr(id, ''); }
});
document.addEventListener('change', e => {
  const t = e.target, co = t.dataset.co;
  if (co === 'type') {
    S.co.type = t.value; $('#coAddr').hidden = t.value !== 'Delivery'; $('#coSum').innerHTML = coSummary(); $('#payWord').textContent = t.value === 'Delivery' ? 'delivery' : 'pickup';
    if (t.value !== 'Delivery') setErr('coAddress', '');
  } else if (co === 'pay') S.co.pay = t.value;
  else if (t.dataset.det === 'size') { S.det.size = t.value; refreshDet(); }
  else if (t.dataset.det === 'extra') { const s = new Set(S.det.extras); t.checked ? s.add(t.value) : s.delete(t.value); S.det.extras = [...s]; refreshDet(); }
  else if (t.dataset.actChange && CHG[t.dataset.actChange]) CHG[t.dataset.actChange](t);
});
document.addEventListener('focusout', e => {
  const t = e.target, co = t.dataset && t.dataset.co;
  if (co === 'name' || co === 'phone' || co === 'address') { const v = validateCo(), id = t.id; if (t.value.trim() || t.closest('.has-error')) setErr(id, v[id] || ''); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.id === 'coForm') submitCheckout(); else if (f.id === 'authForm') submitAuth(f); else if (f.id === 'cusForm') submitCustomer(f); else if (f.id === 'menuForm') submitMenu(f);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.modal')) closeModal(); else closeDd(); }
  if (e.key === 'Tab' && $('.modal')) {
    const els = $$('.modal button:not([disabled]),.modal input,.modal select,.modal textarea').filter(x => x.offsetParent !== null);
    if (!els.length) return; const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

seed(); renderApp();
})();
</script>

</body></html>
